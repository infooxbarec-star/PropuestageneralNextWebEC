    <script>

    document.addEventListener('DOMContentLoaded', async function() {
        const loading = document.getElementById('__bundler_loading');
        function setStatus(msg) {
            if (loading)
                loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener('error', function(e) {
            var p = document.body || document.documentElement;
            var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
            d.id = '__bundler_err';
            d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
            '[bundle] ' + (e.message || e.type) +
            (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
        }, true);

        try {
            const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
            const templateEl = document.querySelector('script[type="__bundler/template"]');
            if (!manifestEl || !templateEl) {
                setStatus('Error: missing bundle data');
                console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
                return;
            }

            const manifest = JSON.parse(manifestEl.textContent);
            let template = JSON.parse(templateEl.textContent);

            const uuids = Object.keys(manifest);
            setStatus('Unpacking ' + uuids.length + ' assets...');

            const blobUrls = {};
            await Promise.all(uuids.map(async (uuid) => {
                const entry = manifest[uuid];
                try {
                    const binaryStr = atob(entry.data);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++)
                        bytes[i] = binaryStr.charCodeAt(i);

                    let finalBytes = bytes;
                    if (entry.compressed) {
                        if (typeof DecompressionStream !== 'undefined') {
                            const ds = new DecompressionStream('gzip');
                            const writer = ds.writable.getWriter();
                            const reader = ds.readable.getReader();
                            writer.write(bytes);
                            writer.close();
                            const chunks = [];
                            let totalLen = 0;
                            while (true) {
                                const {done, value} = await reader.read();
                                if (done)
                                    break;
                                chunks.push(value);
                                totalLen += value.length;
                            }
                            finalBytes = new Uint8Array(totalLen);
                            let offset = 0;
                            for (const chunk of chunks) {
                                finalBytes.set(chunk, offset);
                                offset += chunk.length;
                            }
                        } else {
                            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
                        }
                    }

                    blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], {
                        type: entry.mime
                    }));
                } catch (err) {
                    console.error('Failed to decode asset ' + uuid + ':', err);
                    blobUrls[uuid] = URL.createObjectURL(new Blob([], {
                        type: entry.mime
                    }));
                }
            }));

            const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
            const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
            const resourceMap = {};
            for (const entry of extResources) {
                if (blobUrls[entry.uuid])
                    resourceMap[entry.id] = blobUrls[entry.uuid];
            }

            setStatus('Rendering...');
            for (const uuid of uuids)
                template = template.split(uuid).join(blobUrls[uuid]);

            // Strip integrity + crossorigin — blob URLs from a file:// document inherit
            // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
            // The manifest bytes are ours; SRI protects against CDN compromise, not this.
            template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

            const resourceScript = '<script>window.__resources = ' +
            JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
            ';</' + 'script>';
            // Inject after <head> so the DOCTYPE stays first; prepending the script
            // would push the parser into quirks mode. DOMParser always emits a <head>
            // (synthesizing one if the source HTML omitted it) but may carry
            // attributes through, so match the full opening tag. slice() rather than
            // replace() keeps us clear of $-pattern substitution in resourceScript.
            const headOpen = template.match(/<head[^>]*>/i);
            if (headOpen) {
                const i = headOpen.index + headOpen[0].length;
                template = template.slice(0, i) + resourceScript + template.slice(i);
            }

            // Parse the template and swap the root element. Scripts inserted via
            // DOMParser/replaceWith are inert per spec — re-create each with
            // createElement so they execute, awaiting onload for src scripts to
            // preserve ordering (React before ReactDOM before Babel before text/babel).
            const doc = new DOMParser().parseFromString(template, 'text/html');
            document.documentElement.replaceWith(doc.documentElement);
            const dead = Array.from(document.scripts);
            for (const old of dead) {
                const s = document.createElement('script');
                for (const a of old.attributes)
                    s.setAttribute(a.name, a.value);
                s.textContent = old.textContent;
                // text/babel scripts with a src: fetch and inline. transformScriptTags
                // does XHR against the src, but blob:null/ from a file:// origin is
                // silently dropped. Inlining makes it a plain inline babel script,
                // which transformScriptTags handles unconditionally.
                if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
                    const r = await fetch(s.src);
                    s.textContent = await r.text();
                    s.removeAttribute('src');
                }
                const p = s.src ? new Promise(function(r) {
                    s.onload = s.onerror = r;
                }) : null;
                old.replaceWith(s);
                if (p)
                    await p;
            }
            // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
            // which fired before we swapped the document. Trigger manually if present.
            if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
                window.Babel.transformScriptTags();
            }
        } catch (err) {
            setStatus('Error unpacking: ' + err.message);
            console.error('Bundle unpack error:', err);
        }
    });
    </script>

#f4f1ea;\n  --muted:rgba(244,241,234,0.6);\n  --orange:#ff6b35;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:'Inter',system-ui,sans-serif;\n  background:var(--navy);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  background-image:\n    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(232,213,176,0.06) 0%, transparent 60%),\n    radial-gradient(ellipse 80% 60% at 80% 100%, rgba(255,107,53,0.05) 0%, transparent 60%);\n}\n.wrap{max-width:1360px;margin:0 auto;padding:0 56px}\n.mono{font-family:'JetBrains Mono',monospace}\n\n/* ─── Top bar ─────────────────────────────────────────────────── */\n.topbar{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:32px 56px;\n  border-bottom:1px solid var(--line);\n}\n.brand{display:flex;align-items:center;gap:16px}\n.brand-icon{\n  width:32px;height:46px;border-radius:999px;\n  background:linear-gradient(180deg,#f3e4c2 0%,#d8c195 100%);\n  box-shadow:inset 0 -6px 12px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.15);\n}\n.brand-name{font-weight:800;font-size:24px;letter-spacing:-0.02em}\n.brand-name .accent{color:var(--cream)}\n.client-pill{\n  display:inline-flex;align-items:center;gap:10px;\n  padding:10px 18px;border-radius:999px;\n  border:1px solid var(--line);\n  font-size:12px;font-weight:600;letter-spacing:0.04em;\n}\n.client-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(255,107,53,0.15)}\n.client-pill .label{color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.12em;font-size:10px}\n.client-pill strong{color:var(--cream);font-weight:700}\n\n/* ─── Section spacing ────────────────────────────────────────── */\nsection{padding:96px 0}\n.eyebrow{\n  font-family:'JetBrains Mono',monospace;\n  font-size:11px;letter-spacing:0.2em;text-transform:uppercase;\n  color:var(--cream);opacity:0.85;\n  display:inline-flex;align-items:center;gap:10px;\n  margin-bottom:24px;\n}\n.eyebrow::before{content:\"\";width:24px;height:1px;background:var(--cream);opacity:0.6}\n\n/* ─── Hero ───────────────────────────────────────────────────── */\n.hero h1{\n  font-weight:900;font-size:clamp(48px,5.4vw,84px);\n  letter-spacing:-0.035em;line-height:1.02;\n  margin:0 0 28px;max-width:18ch;text-wrap:balance;\n}\n.hero h1 .em{color:var(--cream)}\n.hero .lede{\n  font-size:18px;line-height:1.55;max-width:62ch;\n  color:var(--muted);margin:0 0 48px;font-weight:500;\n}\n.hero-cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.btn{\n  display:inline-flex;align-items:center;gap:12px;\n  padding:16px 24px;border-radius:6px;\n  font-family:'Inter';font-size:12px;font-weight:700;\n  letter-spacing:0.12em;text-transform:uppercase;\n  border:1px solid transparent;cursor:pointer;\n}\n.btn-primary{background:var(--cream);color:var(--navy)}\n.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}\n.btn .arrow{font-size:16px}\n\n/* ─── KPI grid ───────────────────────────────────────────────── */\n.kpi-grid{\n  display:grid;grid-template-columns:repeat(4,1fr);\n  gap:1px;background:var(--line);\n  border:1px solid var(--line);border-radius:14px;overflow:hidden;\n  margin-top:64px;\n}\n.kpi{\n  background:var(--navy-2);padding:36px 32px;\n  display:flex;flex-direction:column;justify-content:space-between;\n  min-height:200px;\n}\n.kpi .num{\n  font-weight:900;font-size:64px;line-height:1;letter-spacing:-0.04em;\n  color:var(--cream);font-variant-numeric:tabular-nums;\n}\n.kpi .num .unit{font-size:32px;opacity:0.85;margin-left:2px}\n.kpi .label{font-size:13px;color:var(--muted);font-weight:500;line-height:1.4;margin-top:18px;max-width:24ch}\n.kpi .tag{font-size:10px;color:var(--cream);letter-spacing:0.16em;text-transform:uppercase;font-weight:600;margin-bottom:auto}\n\n/* ─── Mockups gallery ────────────────────────────────────────── */\n.gallery-title{\n  font-weight:900;font-size:48px;letter-spacing:-0.03em;line-height:1.05;\n  margin:0 0 16px;max-width:22ch;text-wrap:balance;\n}\n.gallery-sub{font-size:16px;color:var(--muted);max-width:60ch;margin:0 0 56px;line-height:1.55}\n.gallery{\n  display:grid;grid-template-columns:repeat(3,1fr);gap:28px;\n}\n.mock{\n  border-radius:14px;overflow:hidden;\n  box-shadow:0 30px 60px -30px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04);\n  aspect-ratio:16/10;position:relative;\n}\n.mock-caption{\n  display:flex;justify-content:space-between;align-items:baseline;\n  margin-top:18px;\n  font-size:13px;\n}\n.mock-caption .num{font-family:'JetBrains Mono',monospace;color:var(--cream);font-size:11px;letter-spacing:0.12em}\n.mock-caption .name{font-weight:700}\n.mock-caption .role{color:var(--muted);font-weight:500}\n\n/* Mini website inside each card ── shared chrome */\n.mw{height:100%;display:flex;flex-direction:column;font-size:9px}\n.mw .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:7px;font-weight:600}\n.mw .nav .logo{font-weight:800;font-size:9px;letter-spacing:-0.02em}\n.mw .nav nav{display:flex;gap:11px}\n.mw .nav .lang{font-size:7px;letter-spacing:0.1em;font-weight:700}\n.mw .nav .lang .off{opacity:0.4}\n.mw .body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch}\n.mw .left{padding:20px 22px 22px;display:flex;flex-direction:column;justify-content:flex-end}\n.mw .left .eb{font-family:'JetBrains Mono',monospace;font-size:6px;letter-spacing:0.16em;text-transform:uppercase;opacity:0.7;margin-bottom:10px}\n.mw .left .t{font-weight:800;font-size:16px;line-height:1.08;letter-spacing:-0.025em;margin:0 0 8px;text-wrap:balance}\n.mw .left .p{font-size:7.5px;line-height:1.4;opacity:0.75;margin:0 0 12px;max-width:24ch}\n.mw .left .ctas{display:flex;gap:5px}\n.mw .left .b{font-size:6px;font-weight:700;padding:6px 9px;border-radius:2px;letter-spacing:0.1em;text-transform:uppercase}\n.mw .right{background-size:cover;background-position:center}\n.mw .right img{width:100%;height:100%;object-fit:cover;display:block}\n.mw .foot{padding:8px 18px;border-top:1px solid;font-family:'JetBrains Mono',monospace;font-size:6px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.55;display:flex;justify-content:space-between}\n\n/* Variants */\n.mw.eos{background:#0d0d0c;color:#f1ead7}\n.mw.eos .left .b.p{background:#e9c64a;color:#0d0d0c}\n.mw.eos .left .b.s{background:transparent;color:#f1ead7;border:1px solid #f1ead7}\n.mw.eos .foot{border-top-color:rgba(255,255,255,0.08)}\n.mw.eos .nav .accent{color:#e9c64a}\n\n.mw.fc{background:#f5f3ee;color:#1a1a1a}\n.mw.fc .left .b.p{background:#1a1a1a;color:#f5f3ee}\n.mw.fc .left .b.s{background:transparent;color:#1a1a1a;border:1px solid #1a1a1a}\n.mw.fc .foot{border-top-color:rgba(0,0,0,0.08)}\n.mw.fc .nav .accent{color:#cf3a52}\n\n.mw.pl{background:#f0ece4;color:#161513}\n.mw.pl .left .b.p{background:#161513;color:#f0ece4}\n.mw.pl .left .b.s{background:transparent;color:#161513;border:1px solid #161513}\n.mw.pl .foot{border-top-color:rgba(0,0,0,0.08)}\n.mw.pl .nav .accent{color:#7a6c4f}\n\n.mw.oe{background:#f5efe4;color:#1f2a1a}\n.mw.oe .left .b.p{background:#1f2a1a;color:#f5efe4}\n.mw.oe .left .b.s{background:transparent;color:#1f2a1a;border:1px solid #1f2a1a}\n.mw.oe .foot{border-top-color:rgba(0,0,0,0.08)}\n.mw.oe .nav .accent{color:#c8651a}\n\n.mw.as{background:#0d0e10;color:#ebe9e4}\n.mw.as .left .b.p{background:#ebe9e4;color:#0d0e10}\n.mw.as .left .b.s{background:transparent;color:#ebe9e4;border:1px solid #3a3b3f}\n.mw.as .foot{border-top-color:rgba(255,255,255,0.08)}\n.mw.as .nav .accent{color:#d83a2a}\n.mw.as .left .eb{color:#d83a2a;opacity:1}\n\n.mw.cv{background:#ebe5dc;color:#1c1a16}\n.mw.cv .left .b.p{background:#1c1a16;color:#ebe5dc}\n.mw.cv .left .b.s{background:transparent;color:#1c1a16;border:1px solid #1c1a16}\n.mw.cv .foot{border-top-color:rgba(0,0,0,0.08)}\n.mw.cv .nav .accent{color:#9a7a3c}\n\n/* ─── Chart section ──────────────────────────────────────────── */\n.chart-block{\n  display:grid;grid-template-columns:1fr 1.1fr;gap:80px;align-items:center;\n  background:var(--navy-2);border:1px solid var(--line);border-radius:18px;\n  padding:64px;\n}\n.chart-block h2{font-weight:900;font-size:40px;letter-spacing:-0.03em;line-height:1.08;margin:0 0 20px}\n.chart-block p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 28px}\n.legend{display:flex;gap:24px;font-size:12px;font-weight:600}\n.legend .sw{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:8px}\n.legend .a .sw{background:rgba(244,241,234,0.25)}\n.legend .b .sw{background:var(--cream)}\n.bars{display:flex;flex-direction:column;gap:26px}\n.bar-row{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center}\n.bar-row .name{font-size:13px;font-weight:600;color:var(--ink)}\n.bar-row .name .unit{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}\n.bar-pair{display:flex;flex-direction:column;gap:8px}\n.bar{height:14px;border-radius:3px;position:relative;background:rgba(244,241,234,0.06)}\n.bar .fill{height:100%;border-radius:3px;position:relative}\n.bar .fill.before{background:rgba(244,241,234,0.3)}\n.bar .fill.after{background:linear-gradient(90deg,var(--cream) 0%,#f2e4c4 100%)}\n.bar .val{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--navy);white-space:nowrap}\n.bar .val.muted{color:var(--ink);right:auto;left:10px}\n\n/* ─── Timeline ───────────────────────────────────────────────── */\n.timeline-title{font-weight:900;font-size:40px;letter-spacing:-0.03em;line-height:1.08;margin:0 0 16px;max-width:24ch}\n.timeline{\n  display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:48px;\n  position:relative;\n}\n.timeline::before{\n  content:\"\";position:absolute;top:18px;left:5%;right:5%;height:1px;\n  background:linear-gradient(90deg,transparent 0%,var(--cream) 10%,var(--cream) 90%,transparent 100%);\n  opacity:0.35;\n}\n.t-step{position:relative;padding-top:48px;text-align:left;padding-right:24px}\n.t-step .node{\n  position:absolute;top:8px;left:0;\n  width:22px;height:22px;border-radius:50%;\n  background:var(--cream);\n  display:flex;align-items:center;justify-content:center;\n  font-size:9px;font-weight:800;color:var(--navy);\n  font-family:'JetBrains Mono',monospace;\n  box-shadow:0 0 0 5px var(--navy), 0 0 0 6px var(--cream);\n}\n.t-step .when{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;font-weight:600}\n.t-step .what{font-weight:700;font-size:15px;line-height:1.2;margin-bottom:6px;letter-spacing:-0.01em}\n.t-step .desc{font-size:12px;color:var(--muted);line-height:1.5}\n\n/* ─── Investment ────────────────────────────────────────────── */\n.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}\n.inv-card{\n  background:var(--navy-2);border:1px solid var(--line);border-radius:18px;padding:40px 36px;\n  display:flex;flex-direction:column;position:relative;\n}\n.inv-card .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cream);font-weight:600;margin-bottom:24px}\n.inv-card h3{font-weight:900;font-size:32px;letter-spacing:-0.02em;margin:0 0 8px;line-height:1.1}\n.inv-card .price{\n  font-weight:900;font-size:56px;letter-spacing:-0.04em;color:var(--cream);\n  font-variant-numeric:tabular-nums;line-height:1;margin:28px 0 8px;\n}\n.inv-card .price .small{font-size:16px;opacity:0.7;font-weight:700;margin-left:4px}\n.inv-card .price-note{font-size:12px;color:var(--muted);margin-bottom:32px;font-weight:500}\n.inv-card ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:24px}\n.inv-card li{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;gap:16px}\n.inv-card li .what{color:v
